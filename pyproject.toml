[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mammalcam"
version = "0.1.0"
description = "Camera trap pipeline: MegaDetector + species classifier with location-based evaluation, linked to Mammalatlas"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "tabulate>=0.9",  # pandas.to_markdown for reports
    "pillow>=10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
]

[project.optional-dependencies]
detect = ["megadetector>=10"]   # Stage 1, pretrained, inference only
demo = ["gradio>=4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
